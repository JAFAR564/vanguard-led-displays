<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="none">
  <defs>
    <linearGradient id="atriumBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141A23"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="atriumGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="ledWallGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Atrium Interior Shell -->
  <rect width="1200" height="800" fill="url(#atriumBg)"/>

  <!-- Architectural Glass Skylight Lines -->
  <polygon points="200,0 1000,0 850,220 350,220" fill="url(#atriumGlass)" stroke="#334155" stroke-width="1.5"/>
  <line x1="400" y1="0" x2="475" y2="220" stroke="#475569" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="220" stroke="#475569" stroke-width="1"/>
  <line x1="800" y1="0" x2="725" y2="220" stroke="#475569" stroke-width="1"/>

  <!-- Mezzanine Walkways & Balustrades -->
  <rect y="220" width="1200" height="40" fill="#1E2530" stroke="#2D3748" stroke-width="1"/>
  <rect y="440" width="1200" height="40" fill="#1E2530" stroke="#2D3748" stroke-width="1"/>

  <!-- Central Architectural Feature: Giant Bezel-Free LED Video Wall -->
  <rect x="250" y="160" width="700" height="440" rx="4" fill="#0B0F17" stroke="#334155" stroke-width="2"/>
  <rect x="260" y="170" width="680" height="420" rx="2" fill="url(#ledWallGlow)"/>

  <!-- Screen Content: High-Fashion / Commercial Retail Showcase -->
  <rect x="260" y="170" width="680" height="50" fill="#0B0F17"/>
  <text x="290" y="202" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="700">RETAIL PRECINCT · ATRIUM HERO WALL</text>
  <text x="910" y="202" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="end">7,680 Hz CAMERA-SAFE</text>

  <!-- Split Screen Dynamic Imagery Simulation -->
  <rect x="290" y="244" width="370" height="280" rx="4" fill="#141A23" stroke="#2D3748" stroke-width="1"/>
  <text x="320" y="320" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="28" font-weight="700">PRECINCT EXPANDED</text>
  <text x="320" y="354" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14">Centre court brand partnership activations</text>
  <rect x="320" y="380" width="160" height="36" rx="18" fill="#FFFFFF"/>
  <text x="400" y="403" fill="#0B0F17" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">TENANT SLOTS</text>

  <!-- Right Side Split Notice -->
  <rect x="680" y="244" width="230" height="280" rx="4" fill="#141A23" stroke="#2D3748" stroke-width="1"/>
  <text x="704" y="290" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">NON-GLA REVENUE</text>
  <text x="704" y="326" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="18" font-weight="600">DOOH Media</text>
  <text x="704" y="352" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Dayparted advertising loops with live proof-of-play analytics.</text>
  <line x1="704" y1="400" x2="880" y2="400" stroke="#334155" stroke-width="1"/>
  <text x="704" y="430" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">FANLESS SILENT · P1.8</text>

  <!-- Ground Floor Reflections -->
  <rect y="640" width="1200" height="160" fill="#0D1117"/>
  <line x1="0" y1="640" x2="1200" y2="640" stroke="#2D3748" stroke-width="2"/>
</svg>
