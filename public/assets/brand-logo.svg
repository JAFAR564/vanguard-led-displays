<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 54" fill="none" role="img" aria-label="Vanguard Architectural Displays">
  <!-- Architectural Chassis Monogram -->
  <g transform="translate(4, 5)">
    <!-- Primary Chassis Tile (Precision Die-Cast Bevel) -->
    <rect x="0" y="0" width="22" height="44" rx="2" fill="#0B0F17" />
    <!-- Secondary Interlocking Chassis Tile -->
    <rect x="25" y="0" width="18" height="44" rx="2" fill="#1F2937" />
    
    <!-- Hairline Structural Grid Matrix -->
    <line x1="0" y1="14.6" x2="43" y2="14.6" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
    <line x1="0" y1="29.3" x2="43" y2="29.3" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
    
    <!-- Active Telemetry Diode (Electric Cyan) -->
    <circle cx="34" cy="7.5" r="2.2" fill="#38BDF8" />
  </g>

  <!-- Precision Architectural Wordmark -->
  <g transform="translate(62, 0)">
    <text x="0" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="20" font-weight="700" letter-spacing="3.5" fill="#0B0F17">VANGUARD</text>
    <text x="0" y="44" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="8.5" font-weight="500" letter-spacing="2.8" fill="#64748B">ARCHITECTURAL DISPLAYS</text>
  </g>
</svg>
