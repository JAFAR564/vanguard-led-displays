<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none">
  <!-- Sky background -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1280" height="720" fill="url(#skyGrad)"/>

  <!-- Outeniqua Mountain Silhouette (George backdrop) -->
  <path d="M0 430 L160 360 L380 400 L620 310 L840 370 L1100 290 L1280 340 L1280 500 L0 500 Z" fill="url(#mountainGrad)" opacity="0.65"/>
  <path d="M0 460 L240 400 L490 440 L730 380 L980 410 L1280 370 L1280 520 L0 520 Z" fill="#94A3B8" opacity="0.45"/>

  <!-- Ground / Road / Paving -->
  <rect y="500" width="1280" height="220" fill="#334155"/>
  <!-- Road lanes & entrance paving -->
  <polygon points="180,720 380,500 520,500 460,720" fill="#475569"/>
  <polygon points="460,720 520,500 680,500 780,720" fill="#3B4858"/>
  <line x1="470" y1="520" x2="620" y2="720" stroke="#CBD5E1" stroke-width="6" stroke-dasharray="24 16"/>

  <!-- Security Gatehouse Architecture (George Cape-Dutch / Contemporary vernacular) -->
  <rect x="740" y="320" width="380" height="200" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Pitched Charcoal Slate Roof -->
  <polygon points="710,320 930,190 1150,320" fill="#202A36"/>
  <!-- Gatehouse Windows & Security Booth -->
  <rect x="780" y="360" width="140" height="90" fill="#0284C7" opacity="0.3" stroke="#64748B" stroke-width="3"/>
  <line x1="850" y1="360" x2="850" y2="450" stroke="#64748B" stroke-width="2"/>
  <!-- Stone cladding plinth -->
  <rect x="740" y="480" width="380" height="40" fill="#64748B"/>

  <!-- Security Booms -->
  <rect x="680" y="470" width="24" height="50" fill="#E2E8F0" stroke="#475569" stroke-width="2"/>
  <line x1="420" y1="480" x2="690" y2="480" stroke="#DC2626" stroke-width="8"/>
  <line x1="440" y1="480" x2="460" y2="480" stroke="#FFFFFF" stroke-width="8"/>
  <line x1="500" y1="480" x2="520" y2="480" stroke="#FFFFFF" stroke-width="8"/>
  <line x1="560" y1="480" x2="580" y2="480" stroke="#FFFFFF" stroke-width="8"/>
  <line x1="620" y1="480" x2="640" y2="480" stroke="#FFFFFF" stroke-width="8"/>

  <!-- FEATURED OUTDOOR LED SCREEN MONUMENT INSTALLATION -->
  <!-- Architectural Base / Plinth -->
  <rect x="180" y="420" width="220" height="120" rx="4" fill="#202A36" stroke="#475569" stroke-width="2"/>
  <text x="290" y="525" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">ESTATE GATEWAY</text>

  <!-- High-grade IP65 Aluminium LED Display Cabinet (16:9 Landscape) -->
  <rect x="150" y="190" width="280" height="230" rx="6" fill="#0F172A" stroke="#2463B8" stroke-width="4"/>
  <!-- Active LED Matrix Surface -->
  <rect x="160" y="200" width="260" height="210" rx="3" fill="url(#screenGlow)"/>

  <!-- LED Display Content (Real-world estate utility notice) -->
  <!-- Header Bar -->
  <rect x="160" y="200" width="260" height="34" fill="#2463B8"/>
  <text x="290" y="223" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">ESTATE ADVISORY</text>

  <!-- Body Content -->
  <rect x="175" y="246" width="230" height="64" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="185" y="268" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13" font-weight="600">MUNICIPAL WATER NOTICE</text>
  <text x="185" y="288" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="11">Maintenance: Tue 09:00 - 13:00</text>
  <text x="185" y="302" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="10">Pressure restoration in progress</text>

  <!-- Speed Limit & Access Rule Pill -->
  <rect x="175" y="320" width="105" height="48" rx="4" fill="#202A36" stroke="#475569" stroke-width="1"/>
  <text x="227" y="340" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" text-anchor="middle">30 KM/H</text>
  <text x="227" y="356" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">STRICT SPEED LIMIT</text>

  <!-- Resident AGM reminder -->
  <rect x="290" y="320" width="115" height="48" rx="4" fill="#202A36" stroke="#475569" stroke-width="1"/>
  <text x="347" y="340" fill="#10B981" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">HOA AGM: 28 OCT</text>
  <text x="347" y="356" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Clubhouse 18:30</text>

  <!-- Bottom Ticker -->
  <rect x="160" y="380" width="260" height="30" fill="#0F172A"/>
  <text x="290" y="400" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">AUTO-DIM ACTIVE · LUX SENSOR SANS 10160</text>

  <!-- Ambient Light Sensor indicator on top of cabinet -->
  <circle cx="290" cy="186" r="4" fill="#22C55E"/>
  <line x1="290" y1="182" x2="290" y2="190" stroke="#16A34A" stroke-width="2"/>

  <!-- Play Button Overlay for Video Proof -->
  <circle cx="640" cy="360" r="48" fill="#202A36" fill-opacity="0.85" stroke="#FFFFFF" stroke-width="3"/>
  <polygon points="630,340 662,360 630,380" fill="#FFFFFF"/>
  <text x="640" y="435" fill="#202A36" font-family="'Inter', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Watch George Installation Video</text>
  <text x="640" y="458" fill="#475569" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Verified On-Site Performance · Daylight Readability (01:24)</text>
</svg>
