  <rect x="628" y="226" width="210" height="34" rx="4" fill="#0369A1"/>
  <text x="640" y="249" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700">RETAIL ATRIUM PROMO</text>
