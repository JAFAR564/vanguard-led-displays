  <text x="480" y="498" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">IP65 / IP67 WEATHERPROOF</text>
  <text x="730" y="498" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="13">|</text>
  <text x="750" y="498" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">SANS 10160</text>

  <!-- Floating Institutional Trust Cards Beneath Screen -->
  <rect x="120" y="600" width="240" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))"/>
  <text x="140" y="632" fill="#2463B8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">01 · VERIFIED PROOF</text>
  <text x="140" y="660" fill="#202A36" font-family="'Inter', sans-serif" font-size="16" font-weight="700">George Flagship</text>
  <text x="140" y="684" fill="#64748B" font-family="'Inter', sans-serif" font-size="12">Live residential estate deployment</text>

  <rect x="380" y="600" width="240" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))"/>
  <text x="400" y="632" fill="#2463B8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">02 · STSMA PMR 29</text>
  <text x="400" y="660" fill="#202A36" font-family="'Inter', sans-serif" font-size="16" font-weight="700">Governance Ready</text>
  <text x="400" y="684" fill="#64748B" font-family="'Inter', sans-serif" font-size="12">Itemised quotes for trustee sign-off</text>

  <rect x="640" y="600" width="240" height="130" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))"/>
  <text x="660" y="632" fill="#2463B8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">03 · SANS CERTIFIED</text>
  <text x="660" y="660" fill="#202A36" font-family="'Inter', sans-serif" font-size="16" font-weight="700">Electrical & Wind</text>
  <text x="660" y="684" fill="#64748B" font-family="'Inter', sans-serif" font-size="12">Engineered for Cape coastal weather</text>
