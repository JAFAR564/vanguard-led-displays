  <line x1="750" y1="80" x2="750" y2="720" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Main Hero Screen Model (Curved & Bezel-Free Architectural Mockup) -->
  <rect x="100" y="110" width="800" height="460" rx="12" fill="url(#heroCardGrad)" stroke="#334155" stroke-width="3"/>

