  <text x="640" y="380" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">800 NITS · FANLESS</text>
  <text x="640" y="398" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Zero acoustic interference</text>

